<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield with Golden Border -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.4" />

  <!-- Rising Sun Behind Bridge -->
  <circle cx="256" cy="216" r="62" fill="url(#goldGrad)" opacity="0.95" />
  <circle cx="256" cy="216" r="94" fill="url(#sunGlow)" />
  
  <!-- Sun Rays -->
  <g stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="130" x2="256" y2="106" />
    <line x1="202" y1="144" x2="184" y2="126" />
    <line x1="310" y1="144" x2="328" y2="126" />
    <line x1="166" y1="184" x2="142" y2="176" />
    <line x1="346" y1="184" x2="370" y2="176" />
    <line x1="152" y1="232" x2="128" y2="234" />
    <line x1="360" y1="232" x2="384" y2="234" />
  </g>

  <!-- Fertile Furrows / Field Rays at Bottom -->
  <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.3" fill="none">
    <path d="M 120,404 L 256,290 L 392,404" />
    <path d="M 164,412 L 256,306 L 348,412" />
    <path d="M 210,418 L 256,318 L 302,418" />
  </g>

  <!-- The "Setu" (Modern Arch Bridge connecting Farmer to Mandi) -->
  <path d="M 104,330 C 160,248 352,248 408,330" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" />
  <path d="M 116,344 C 168,270 344,270 396,344" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <!-- Bridge Suspension Pillars -->
  <g stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.8">
    <line x1="172" y1="284" x2="172" y2="350" />
    <line x1="214" y1="264" x2="214" y2="354" />
    <line x1="256" y1="256" x2="256" y2="356" />
    <line x1="298" y1="264" x2="298" y2="354" />
    <line x1="340" y1="284" x2="340" y2="350" />
  </g>

  <!-- Left Golden Wheat Stalk (Mature Grain) -->
  <g fill="url(#goldGrad)" stroke="#713f12" stroke-width="1">
    <path d="M 128,356 C 100,278 110,180 148,124" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" />
    <ellipse cx="148" cy="120" rx="9" ry="16" transform="rotate(-15 148 120)" />
    <ellipse cx="132" cy="144" rx="9" ry="17" transform="rotate(-35 132 144)" />
    <ellipse cx="158" cy="154" rx="9" ry="17" transform="rotate(10 158 154)" />
    <ellipse cx="124" cy="180" rx="10" ry="18" transform="rotate(-40 124 180)" />
    <ellipse cx="152" cy="192" rx="10" ry="18" transform="rotate(5 152 192)" />
    <ellipse cx="118" cy="220" rx="10" ry="18" transform="rotate(-42 118 220)" />
    <ellipse cx="146" cy="234" rx="10" ry="18" transform="rotate(2 146 234)" />
    <ellipse cx="114" cy="262" rx="10" ry="17" transform="rotate(-45 114 262)" />
    <ellipse cx="142" cy="276" rx="10" ry="17" transform="rotate(0 142 276)" />
    <!-- Wheat Awns / Bristles -->
    <path d="M 148,104 L 152,72 M 126,130 L 98,106 M 164,142 L 186,120 M 118,166 L 86,146 M 112,206 L 76,188" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Right Golden Wheat Stalk (Mirror) -->
  <g fill="url(#goldGrad)" stroke="#713f12" stroke-width="1">
    <path d="M 384,356 C 412,278 402,180 364,124" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round" />
    <ellipse cx="364" cy="120" rx="9" ry="16" transform="rotate(15 364 120)" />
    <ellipse cx="380" cy="144" rx="9" ry="17" transform="rotate(35 380 144)" />
    <ellipse cx="354" cy="154" rx="9" ry="17" transform="rotate(-10 354 154)" />
    <ellipse cx="388" cy="180" rx="10" ry="18" transform="rotate(40 388 180)" />
    <ellipse cx="360" cy="192" rx="10" ry="18" transform="rotate(-5 360 192)" />
    <ellipse cx="394" cy="220" rx="10" ry="18" transform="rotate(42 394 220)" />
    <ellipse cx="366" cy="234" rx="10" ry="18" transform="rotate(-2 366 234)" />
    <ellipse cx="398" cy="262" rx="10" ry="17" transform="rotate(45 398 262)" />
    <ellipse cx="370" cy="276" rx="10" ry="17" transform="rotate(0 370 276)" />
    <!-- Wheat Awns / Bristles -->
    <path d="M 364,104 L 360,72 M 386,130 L 414,106 M 348,142 L 326,120 M 394,166 L 426,146 M 400,206 L 436,188" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Smart Digital Tech Node (Center Sparkle) -->
  <circle cx="256" cy="216" r="14" fill="#ffffff" />
  <circle cx="256" cy="216" r="22" fill="none" stroke="#facc15" stroke-width="3.5" />

  <!-- Bottom Brand Text Ribbon -->
  <g filter="url(#shadow)">
    <rect x="96" y="380" width="320" height="66" rx="33" fill="#4c0519" stroke="url(#goldGrad)" stroke-width="4" />
    <text x="256" y="423" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" letter-spacing="3.5">KISAN SETU</text>
  </g>
</svg>
