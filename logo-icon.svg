<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="iconGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="iconSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="45%" stop-color="#eab308" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield with Golden Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#iconBgGrad)" stroke="url(#iconGoldGrad)" stroke-width="14" filter="url(#iconShadow)" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#iconGoldGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.45" />

  <!-- Rising Sun Behind Bridge -->
  <circle cx="256" cy="230" r="70" fill="url(#iconGoldGrad)" opacity="0.95" />
  <circle cx="256" cy="230" r="106" fill="url(#iconSunGlow)" />
  
  <!-- Sun Rays -->
  <g stroke="url(#iconGoldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="130" x2="256" y2="102" />
    <line x1="196" y1="146" x2="176" y2="124" />
    <line x1="316" y1="146" x2="336" y2="124" />
    <line x1="154" y1="192" x2="126" y2="182" />
    <line x1="358" y1="192" x2="386" y2="182" />
    <line x1="138" y1="248" x2="110" y2="250" />
    <line x1="374" y1="248" x2="402" y2="250" />
  </g>

  <!-- Fertile Furrows / Field Rays at Bottom -->
  <g stroke="url(#iconGoldGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M 120,420 L 256,290 L 392,420" />
    <path d="M 164,430 L 256,310 L 348,430" />
    <path d="M 210,436 L 256,326 L 302,436" />
  </g>

  <!-- The "Setu" (Modern Arch Bridge) -->
  <path d="M 96,350 C 156,256 356,256 416,350" fill="none" stroke="url(#iconGoldGrad)" stroke-width="22" stroke-linecap="round" />
  <path d="M 108,366 C 164,280 348,280 404,366" fill="none" stroke="#fef08a" stroke-width="7" stroke-linecap="round" opacity="0.9" />
  
  <!-- Bridge Suspension Pillars -->
  <g stroke="url(#iconGoldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="168" y1="298" x2="168" y2="376" />
    <line x1="212" y1="276" x2="212" y2="382" />
    <line x1="256" y1="268" x2="256" y2="384" />
    <line x1="300" y1="276" x2="300" y2="382" />
    <line x1="344" y1="298" x2="344" y2="376" />
  </g>

  <!-- Left Golden Wheat Stalk -->
  <g fill="url(#iconGoldGrad)" stroke="#713f12" stroke-width="1">
    <path d="M 124,374 C 94,290 106,184 146,124" fill="none" stroke="url(#iconGoldGrad)" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="146" cy="120" rx="10" ry="18" transform="rotate(-15 146 120)" />
    <ellipse cx="128" cy="146" rx="10" ry="19" transform="rotate(-35 128 146)" />
    <ellipse cx="156" cy="158" rx="10" ry="19" transform="rotate(10 156 158)" />
    <ellipse cx="120" cy="184" rx="11" ry="20" transform="rotate(-40 120 184)" />
    <ellipse cx="150" cy="198" rx="11" ry="20" transform="rotate(5 150 198)" />
    <ellipse cx="114" cy="226" rx="11" ry="20" transform="rotate(-42 114 226)" />
    <ellipse cx="144" cy="242" rx="11" ry="20" transform="rotate(2 144 242)" />
    <ellipse cx="110" cy="270" rx="11" ry="19" transform="rotate(-45 110 270)" />
    <ellipse cx="140" cy="286" rx="11" ry="19" transform="rotate(0 140 286)" />
    <!-- Wheat Awns -->
    <path d="M 146,102 L 150,68 M 122,130 L 92,104 M 164,144 L 188,120 M 114,170 L 80,148 M 108,212 L 70,192" stroke="url(#iconGoldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Right Golden Wheat Stalk -->
  <g fill="url(#iconGoldGrad)" stroke="#713f12" stroke-width="1">
    <path d="M 388,374 C 418,290 406,184 366,124" fill="none" stroke="url(#iconGoldGrad)" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="366" cy="120" rx="10" ry="18" transform="rotate(15 366 120)" />
    <ellipse cx="384" cy="146" rx="10" ry="19" transform="rotate(35 384 146)" />
    <ellipse cx="356" cy="158" rx="10" ry="19" transform="rotate(-10 356 158)" />
    <ellipse cx="392" cy="184" rx="11" ry="20" transform="rotate(40 392 184)" />
    <ellipse cx="362" cy="198" rx="11" ry="20" transform="rotate(-5 362 198)" />
    <ellipse cx="398" cy="226" rx="11" ry="20" transform="rotate(42 398 226)" />
    <ellipse cx="368" cy="242" rx="11" ry="20" transform="rotate(-2 368 242)" />
    <ellipse cx="402" cy="270" rx="11" ry="19" transform="rotate(45 402 270)" />
    <ellipse cx="372" cy="286" rx="11" ry="19" transform="rotate(0 372 286)" />
    <!-- Wheat Awns -->
    <path d="M 366,102 L 362,68 M 390,130 L 420,104 M 348,144 L 324,120 M 398,170 L 432,148 M 404,212 L 442,192" stroke="url(#iconGoldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Smart Digital Tech Node (Center Sparkle) -->
  <circle cx="256" cy="230" r="16" fill="#ffffff" />
  <circle cx="256" cy="230" r="26" fill="none" stroke="#facc15" stroke-width="4" />
</svg>
